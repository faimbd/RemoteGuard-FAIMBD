<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: #0a0a0d;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Luxury Golden & Black Mix Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5be53"/>
      <stop offset="18%" stop-color="#6b4e12"/>
      <stop offset="42%" stop-color="#141210"/>
      <stop offset="68%" stop-color="#09090c"/>
      <stop offset="86%" stop-color="#5d4410"/>
      <stop offset="100%" stop-color="#f2cd60"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Metallic Golden Shield Gradients -->
    <linearGradient id="shieldOuter" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="24%" stop-color="#f5c542"/>
      <stop offset="55%" stop-color="#d4a024"/>
      <stop offset="82%" stop-color="#9e7210"/>
      <stop offset="100%" stop-color="#f7d66b"/>
    </linearGradient>

    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffef9e"/>
      <stop offset="30%" stop-color="#f3c13a"/>
      <stop offset="65%" stop-color="#c9931a"/>
      <stop offset="100%" stop-color="#7c5608"/>
    </linearGradient>

    <linearGradient id="shieldHalfShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="50.1%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Deep Black Remote Icon Gradient -->
    <linearGradient id="blackIconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1f24"/>
      <stop offset="50%" stop-color="#0b0b0e"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.72"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <clipPath id="faimClip">
      <circle cx="806" cy="806" r="126"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#centerGlow)"/>

  <!-- Subtle dark vignette ring -->
  <rect x="28" y="28" width="968" height="968" rx="180" fill="none" stroke="url(#shieldOuter)" stroke-width="6" stroke-opacity="0.45"/>

  <!-- LARGE GOLDEN SHIELD (Centerpiece) -->
  <g filter="url(#dropShadow)">
    <!-- Outer beveled shield rim -->
    <path d="M512 96
             C615 152, 742 178, 846 188
             L846 472
             C846 694, 686 838, 512 918
             C338 838, 178 694, 178 472
             L178 188
             C282 178, 409 152, 512 96 Z"
          fill="url(#shieldOuter)"/>

    <!-- Inner sculpted shield body -->
    <path d="M512 132
             C605 182, 720 206, 812 216
             L812 468
             C812 668, 668 800, 512 874
             C356 800, 212 668, 212 468
             L212 216
             C304 206, 419 182, 512 132 Z"
          fill="url(#shieldInner)" stroke="#5c3e04" stroke-width="5"/>

    <!-- Metallic split sheen -->
    <path d="M512 132
             C605 182, 720 206, 812 216
             L812 468
             C812 668, 668 800, 512 874
             C356 800, 212 668, 212 468
             L212 216
             C304 206, 419 182, 512 132 Z"
          fill="url(#shieldHalfShade)"/>
  </g>

  <!-- LARGE BLACK REMOTE ICON INSIDE THE GOLDEN SHIELD -->
  <g transform="translate(0, 12)">
    <!-- Wireless Remote Signal Arcs (Top) -->
    <path d="M402 318 A156 156 0 0 1 622 318" fill="none" stroke="#0b0b0e" stroke-width="24" stroke-linecap="round"/>
    <path d="M446 364 A96 96 0 0 1 578 364" fill="none" stroke="#0b0b0e" stroke-width="22" stroke-linecap="round"/>
    <circle cx="512" cy="404" r="18" fill="#0b0b0e"/>

    <!-- Sleek Black Remote Desktop Monitor / Control Body -->
    <rect x="318" y="446" width="388" height="236" rx="28" fill="url(#blackIconGrad)" stroke="#3b2905" stroke-width="4"/>
    <!-- Inner golden screen outline for crisp contrast -->
    <rect x="348" y="476" width="328" height="176" rx="14" fill="#181510" stroke="#e5b83b" stroke-width="5"/>

    <!-- Remote Control Cursor Arrow inside the Black Monitor -->
    <path d="M484 510 L484 612 L512 586 L534 628 L554 617 L532 575 L568 575 Z"
          fill="#f5c542" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

    <!-- Monitor Stand & Base -->
    <rect x="478" y="680" width="68" height="44" fill="#0b0b0e"/>
    <rect x="412" y="718" width="200" height="26" rx="13" fill="#0b0b0e"/>
  </g>

  <!-- SMALL FAIM BD LOGO AT BOTTOM-RIGHT CORNER -->
  <g filter="url(#badgeShadow)">
    <circle cx="806" cy="806" r="136" fill="#09090c" stroke="url(#shieldOuter)" stroke-width="10"/>
    <image href="file:///E:/Anti%20Gravity/Software/RemoteGuard/Assets/faimbd_logo.png"
           x="680" y="680" width="252" height="252"
           clip-path="url(#faimClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
</body>
</html>
